<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>זוהר עמראני - עבודות בנייה ושיפוצים</title>
<meta name="description" content="זוהר עמראני — בנייה, שיפוצים, מיזוג אוויר ואינסטלציה. עבודות לפני ואחרי.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<!-- מסמן שיש JS עוד לפני הציור הראשון, כדי שהחשיפה ההדרגתית תתחיל מוסתרת
     ולא תהבהב פנימה־והחוצה. בלי JS הכול פשוט מוצג כרגיל. -->
<script>document.documentElement.classList.add('js');</script>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#top"><span id="brandName"></span><span class="dot">.</span></a>
  <nav>
    <a href="#work" id="navWork"></a>
    <a href="#services" id="navServices"></a>
    <a href="#contact" id="navContact"></a>
  </nav>
  <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
</header>

<main id="top">

  <!-- ===================== HERO ===================== -->
  <section class="hero">
    <div class="hero__head">
      <div>
        <h1 id="heroName"></h1>
        <p class="hero__title" id="heroTitle"></p>
      </div>
      <ul class="contact-list">
        <li>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>
          <a class="ltr" id="heroPhone" href="#"></a>
        </li>
        <li>
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 6l9 7 9-7"/><path d="M3 19l7-6.5M21 19l-7-6.5"/></svg>
          <a class="ltr" id="heroEmail" href="#"></a>
        </li>
      </ul>
    </div>
    <p class="hero__lede" id="heroLede"></p>
    <dl class="facts" id="heroFacts"></dl>
  </section>

  <!-- הקו האנכי עם עיגול בכל כותרת מקטע, כמו בקורות החיים -->
  <div class="rail">

    <!-- ===================== עבודות — לפני ואחרי ===================== -->
    <section id="work">
      <div class="section-head">
        <h2 class="sec-title reveal" id="workHeading"></h2>
        <span class="section-sub" id="workSubtitle"></span>
      </div>
      <div class="filters" id="filters" role="group"></div>
      <div class="projects" id="projects"></div>
    </section>

    <!-- ===================== תחומי עבודה ===================== -->
    <section id="services">
      <div class="section-head"><h2 class="sec-title reveal" id="servicesHeading"></h2></div>
      <div class="rows" id="serviceRows"></div>
    </section>

  </div>

  <!-- ===================== CONTACT ===================== -->
  <footer class="footer" id="contact">
    <h2 class="sec-title" id="contactHeading"></h2>
    <div class="contact-info">
      <a class="mail ltr" id="contactPhone" href="#"></a>
      <a class="mail ltr" id="contactEmail" href="#"></a>
    </div>
    <div class="footer-row">
      <span id="footerLine"></span>
      <span class="ltr" id="footerCopyright"></span>
    </div>
  </footer>

</main>

<script src="js/content.js"></script>
<script src="js/main.js"></script>
</body>
</html>
